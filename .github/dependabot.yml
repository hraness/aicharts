version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      next-runtime:
        patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch
      posthog-runtime:
        patterns:
          - "@posthog/nextjs-config"
          - posthog-js
          - posthog-node
        update-types:
          - minor
          - patch
      react-runtime:
        patterns:
          - react
          - react-dom
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
