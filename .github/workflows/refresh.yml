name: Refresh Releases

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-releases
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh normalized release dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run data:refresh
      - run: bun run check
      - name: Open PR when data changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet data/releases.json; then
            echo "No release data changes."
            exit 0
          fi
          branch="automation/data-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/releases.json
          git commit -m "chore: refresh release dataset"
          git push -u origin "$branch"
          gh pr create --title "chore: refresh release dataset" --body "Automated benchmark and release feed refresh." --base main --head "$branch"
