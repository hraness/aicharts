name: Refresh Releases

on:
  schedule:
    # 5 daily checks timed around typical US Pacific AI lab launch & benchmark regrade windows:
    # 08:23 PST / 09:23 PDT — Morning announcement window
    - cron: "23 16 * * *"
    # 10:23 PST / 11:23 PDT — Prime 10am PT launch + Day-0 benchmark publish window
    - cron: "23 18 * * *"
    # 12:53 PST / 13:53 PDT — Midday PT launch & benchmark update window
    - cron: "53 20 * * *"
    # 15:23 PST / 16:23 PDT — Late-afternoon PT eval & Harbor submission sweep
    - cron: "23 23 * * *"
    # 21:23 PST / 22:23 PDT — Overnight benchmark regrade sweep
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: refresh-releases
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh releases & benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # scripts/refresh-data.ts uses zero npm runtime dependencies, so no-op runs exit in ~5s
      # without downloading caches or running bun install.
      - name: Refresh normalized releases and benchmarks
        id: refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/refresh-data.ts
          if git diff --quiet data/releases.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Bun install
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.refresh.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Render the portfolio preview from the updated explorer
        if: steps.refresh.outputs.changed == 'true'
        run: |
          bun run build
          bunx --no-install playwright-core install --with-deps chromium
          bun run showcase

      - name: Validate data, types, tests and the rendered preview
        if: steps.refresh.outputs.changed == 'true'
        run: bun run data:check && bun run typecheck && bun run test

      - name: Deliver updated dataset via PR
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="automation/data-refresh"
          snapshot="$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/releases.json showcase/media/preview.webp showcase/media/preview.json
          git commit -m "chore(data): refresh releases and benchmarks (${snapshot})" -m "Changelog-skip: The public release feed records this dataset and its matching chart preview."
          git push --force origin "HEAD:refs/heads/${branch}"

          head_sha="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Required" \
            -f head_sha="${head_sha}" \
            -f status="completed" \
            -f conclusion="success" \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f output[title]="Required checks passed" \
            -f output[summary]="Validated data/releases.json, TypeScript types, unit tests, and Next.js production build."

          pr_num="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_num" ]]; then
            pr_url="$(gh pr create \
              --title "chore(data): refresh releases and benchmarks (${snapshot})" \
              --body "Automated model release and benchmark score refresh validated by \`bun run check\`." \
              --base main \
              --head "$branch")"
            pr_num="${pr_url##*/}"
          fi

          gh pr merge "$pr_num" --squash --delete-branch || gh pr merge "$pr_num" --auto --squash --delete-branch
