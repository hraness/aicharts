name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production:
        description: Also verify the fixed public production site
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Pull requests cancel superseded runs; every main push keeps its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # Pull requests skip the jobs whose inputs did not change against their base.
  # A push to main diffs against the previous main head (github.event.before),
  # so every main change to a filtered job's inputs still runs that job on main.
  # Manual runs, and a push without a previous head, execute everything.
  # scripts/check-changed.ts reads these same filters for local handoff.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.rust == 'true' }}
      formal: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.formal == 'true' }}
      worker: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.worker == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            rust:
              - "crates/**"
              - "vendor/**"
              - "fixtures/**"
              - "data/usage-*.json"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "package.json"
              - ".github/workflows/ci.yml"
            formal:
              - "verify/**"
              - "scripts/assurance-*"
              - "crates/**"
              - "vendor/**"
              - "fixtures/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "package.json"
              - "bun.lock"
              - ".github/workflows/ci.yml"
            # The Worker's import closure (scripts/ci-changes.test.ts checks it)
            # plus the inputs its adapter and conformance gates read.
            worker:
              - "services/**"
              - "lib/usage/**"
              - "lib/result*"
              - "data/usage-*.json"
              - "fixtures/**"
              - "crates/**"
              - "vendor/**"
              - "verify/**"
              - "scripts/assurance-*"
              - "scripts/usage-worker-tools.ts"
              - "package.json"
              - "bun.lock"
              - "tsconfig.json"
              - "bunfig.toml"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".nvmrc"
              - ".github/workflows/ci.yml"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      # Pull requests restore caches only; main saves them.
      - name: Save the Bun download cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Check assurance registry and native corpus
        run: bun run usage:assurance:check
      - name: Check cost surfaces
        run: bun run check:cost-surfaces
      - name: Check generated data and assets
        run: bun run check:generated
      - name: Check skill scripts
        run: bun run skill:check
      - name: Check release archive format
        run: bun run release:archive:check
      - name: Check release manifest matching
        run: bun run release:manifest:check
      - name: Check release build matching
        run: bun run release:build:check
      - name: Check release assembly
        run: bun run release:assemble:check
      - name: Check release Git source reader
        run: bun run release:source:check
      - name: Check release source hydration
        run: bun run release:source:hydrate:check
      - name: Check Linux qualification
        run: bun run release:linux:qualification:check
      - name: Check Linux notices
        run: bun run release:linux:notices:check
      - name: Check Linux qualification runner
        run: bun run release:linux:runner:check
      - name: Check release publication path
        run: bun run release:publish:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      # One webpack cache entry per lockfile per day, saved only by main, bounds
      # churn in the shared 10 GB cache; pull requests restore the newest entry.
      - name: Name the Next.js build cache day
        id: next_cache
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the Next.js build cache
        id: next_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts') }}-${{ steps.next_cache.outputs.day }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts') }}-
      - name: Build application
        run: bun run build
      - name: Record the Next.js build cache size
        run: du -sh .next/cache || true
      - name: Save the Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.next_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts') }}-${{ steps.next_cache.outputs.day }}
      # Both browser suites start their own server on a free port against the
      # same build and use the runner's preinstalled Chrome. They run one after
      # the other: the cross-tab contracts are timing-sensitive and a second
      # server plus browser contexts on the same runner made them flake.
      - name: Browser contracts against the production build
        run: bun run test:browser
      - name: Verify public pages at phone and desktop sizes
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          SITE_BROWSER_ARTIFACTS: ${{ runner.temp }}/public-site-candidate
        run: node scripts/verify-public-site-browser.mjs
      - name: Verify the fixed public production site
        if: github.event_name == 'workflow_dispatch' && inputs.production
        env:
          SITE_BROWSER_ARTIFACTS: ${{ runner.temp }}/public-site-production
        run: node scripts/verify-public-site-browser.mjs --production
      - name: Save public-page browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-site-browser
          path: ${{ runner.temp }}/public-site-*
          if-no-files-found: error
          retention-days: 7

  worker:
    name: Worker
    needs: [changes]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check usage worker in local workerd
        run: bun run usage:worker:check

  worker-gates:
    name: Worker gates
    needs: [changes]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      # The adapter and conformance gates build Rust under checked bounds (the
      # 180 s build bound in vendor/tokscale-core/QUALIFICATION.json and the
      # 180 s process limit of the conformance manifest) that assume warm
      # dependency artifacts, as a developer machine has. The pinned toolchain,
      # a cache of the two gate build directories and an unbounded dependency
      # build ahead of the gates provide that; the gates themselves stay
      # bounded. The conformance gate builds with the workflow's
      # CARGO_INCREMENTAL stripped from its environment, so its pre-build runs
      # the same way to share fingerprints. The gates guard the Worker
      # implementation, so they share the Worker's change filter (which also
      # watches verify/**, the conformance manifests they read); the formal
      # job's filter does not cover them.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore gate build directories
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/adapter-qualification
            target/assurance/conformance-build
          key: worker-gates-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'vendor/tokscale-core/Cargo.lock') }}
          restore-keys: worker-gates-${{ runner.os }}-
      - name: Build gate dependencies
        run: |
          RUSTC="$(rustup which --toolchain 1.97.1 rustc)"
          export RUSTC
          cargo test --locked --manifest-path vendor/tokscale-core/Cargo.toml --lib --no-run --target-dir target/adapter-qualification --jobs 2
          env -u CARGO_INCREMENTAL CARGO_TARGET_DIR=target/assurance/conformance-build cargo test --locked -p aicharts-ledger --test assurance_conformance --no-run
      - name: Generate Worker binding types
        run: bun scripts/usage-worker-tools.ts types
      - name: Check protocol adapters
        run: bun run usage:adapters:check
      - name: Check implementation conformance schedules and mutant
        if: ${{ !cancelled() }}
        run: bun run usage:conformance:check
      - name: Save gate build directories
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/adapter-qualification
            target/assurance/conformance-build
          key: worker-gates-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'vendor/tokscale-core/Cargo.lock') }}
      - name: Retain adapter and conformance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-${{ github.sha }}
          # The conformance stages symlink the repository's node_modules and the
          # resolved tool binaries; the retained evidence is the receipts, logs,
          # traces and staged sources, not a copy of either.
          path: |
            target/assurance/adapters/
            target/assurance/conformance/
            !target/assurance/conformance/**/node_modules/**
            !target/assurance/conformance/*/tools/**
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format, lint, and test usage crates
        run: bun run usage:check

  formal:
    name: Formal verification
    needs: [changes]
    if: needs.changes.outputs.formal == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check bootstrap prerequisites
        run: python3 --version && zstd --version && rustup --version && rustup show active-toolchain
      - name: Record Linux disk headroom before provisioning
        run: df -h .
      - name: Check bootstrap admission regressions
        run: bun test scripts/assurance-tools.test.ts && python3 verify/tools/test_prepare.py
      - name: Provision checksum-pinned formal tools
        id: tools
        run: bun scripts/assurance-tools.ts
      - name: Check model suites
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bun run usage:formal:tla
      # Theorem receipts precede the Kani gate: every theorem replacement in
      # verify/kani/harnesses.json must bind to a receipt for the same bytes.
      - name: Check fresh production Lean proofs and mutations
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bun run usage:formal:theorems
      - name: Check production Kani obligations and mutations
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bun run usage:formal:kani
      - name: Record Linux tool footprint and remaining capacity
        if: always()
        run: |
          df -h .
          if test -d target/assurance-tools; then du -sh target/assurance-tools; fi
      - name: Retain formal receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-verification-${{ github.sha }}
          path: |
            target/assurance/tools/
            target/assurance/tla/
            target/assurance/kani/
            target/assurance/theorems/
            verify/tools/manifest.json
            verify/kani/toolchain.json
            verify/lean/toolchain.json
            verify/tla/toolchain.json
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required
    if: always()
    needs: [changes, checks, build, worker, worker-gates, rust, formal]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          WORKER_GATES_RESULT: ${{ needs.worker-gates.result }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          FORMAL_CHANGED: ${{ needs.changes.outputs.formal }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$CHECKS_RESULT" = success
          test "$BUILD_RESULT" = success
          # A filtered job passes only as a deliberate skip: its inputs did not change.
          test "$WORKER_RESULT" = success || { test "$WORKER_RESULT" = skipped && test "$WORKER_CHANGED" = false; }
          test "$WORKER_GATES_RESULT" = success || { test "$WORKER_GATES_RESULT" = skipped && test "$WORKER_CHANGED" = false; }
          test "$RUST_RESULT" = success || { test "$RUST_RESULT" = skipped && test "$RUST_CHANGED" = false; }
          test "$FORMAL_RESULT" = success || { test "$FORMAL_RESULT" = skipped && test "$FORMAL_CHANGED" = false; }
