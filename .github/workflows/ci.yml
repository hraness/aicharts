name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production:
        description: Also verify the fixed public production site
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Pull requests cancel superseded runs; every main push keeps its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      # Pull requests restore caches only; main saves them.
      - name: Save the Bun download cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Check cost surfaces
        run: bun run check:cost-surfaces
      - name: Check generated data and assets
        run: bun run check:generated
      - name: Check skill scripts
        run: bun run skill:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      # One webpack cache entry per lockfile per day, saved only by main, bounds
      # churn in the shared 10 GB cache; pull requests restore the newest entry.
      - name: Name the Next.js build cache day
        id: next_cache
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the Next.js build cache
        id: next_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts') }}-${{ steps.next_cache.outputs.day }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts') }}-
      - name: Build application
        run: bun run build
      - name: Record the Next.js build cache size
        run: du -sh .next/cache || true
      - name: Save the Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.next_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock', 'next.config.ts') }}-${{ steps.next_cache.outputs.day }}
      - name: Install the lockfile-pinned Chromium and Linux dependencies
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      # Both browser suites start their own server on a free port against the
      # same build and use the lockfile-pinned Chromium. They run one after
      # the other: the cross-tab contracts are timing-sensitive and a second
      # server plus browser contexts on the same runner made them flake.
      - name: Browser contracts against the production build
        run: bun run test:browser
      - name: Verify public pages at phone and desktop sizes
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          SITE_BROWSER_ARTIFACTS: ${{ runner.temp }}/public-site-candidate
        run: node scripts/verify-public-site-browser.mjs
      - name: Verify the fixed public production site
        if: github.event_name == 'workflow_dispatch' && inputs.production
        env:
          SITE_BROWSER_ARTIFACTS: ${{ runner.temp }}/public-site-production
        run: node scripts/verify-public-site-browser.mjs --production
      - name: Save public-page browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-site-browser
          path: ${{ runner.temp }}/public-site-*
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required
    if: always()
    needs: [checks, build]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          test "$CHECKS_RESULT" = success
          test "$BUILD_RESULT" = success
