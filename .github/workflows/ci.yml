name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check application
        run: bun run check

  menubar:
    name: Menubar
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: desktop
      - name: Build aicharts-menubar
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml

  formal:
    name: Formal verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check bootstrap prerequisites
        run: python3 --version && zstd --version && rustup --version
      - name: Record Linux disk headroom before provisioning
        run: df -h .
      - name: Check bootstrap admission regressions
        run: bun test scripts/assurance-tools.test.ts && python3 verify/tools/test_prepare.py
      - name: Provision checksum-pinned formal tools
        id: tools
        run: bun scripts/assurance-tools.ts
      - name: Check model suites
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bun run usage:formal:tla
      - name: Check production Kani obligations and mutations
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bun run usage:formal:kani
      - name: Check fresh production Lean proofs and mutations
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bun run usage:formal:theorems
      - name: Record Linux tool footprint and remaining capacity
        if: always()
        run: |
          df -h .
          if test -d target/assurance-tools; then du -sh target/assurance-tools; fi
      - name: Retain formal receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-verification-${{ github.sha }}
          path: |
            target/assurance/tools/
            target/assurance/tla/
            target/assurance/kani/
            target/assurance/theorems/
            verify/tools/manifest.json
            verify/kani/toolchain.json
            verify/lean/toolchain.json
            verify/tla/toolchain.json
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required
    if: always()
    needs: [check, menubar, formal]
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking job
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          MENUBAR_RESULT: ${{ needs.menubar.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
        run: test "$CHECK_RESULT" = success && test "$MENUBAR_RESULT" = success && test "$FORMAL_RESULT" = success
