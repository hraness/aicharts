name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Check public changelog coverage
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/check-journal.ts --base "$BASE" --tree "$GITHUB_SHA" --head "$HEAD"
      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate data, types, tests, and production build
        run: bun run check
      - run: bunx --no-install playwright-core install --with-deps chromium
      - name: Replay the reasoning-cost comparison
        id: journeys
        run: node_modules/.bin/ra walk compare-reasoning-cost
      - name: Keep journey evidence
        if: ${{ !cancelled() && steps.journeys.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-walks
          path: .ra/walks/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Check the guide and changelog in Chromium
        run: bun run check:journal:browser

  required:
    name: Required
    if: always()
    needs:
      - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require all blocking jobs
        run: |
          if [[ "${{ needs.checks.result }}" != "success" ]]; then
            echo "Checks result was ${{ needs.checks.result }}"
            exit 1
          fi
