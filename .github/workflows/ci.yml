name: CI

on:
  pull_request:
    # Data-refresh PRs dispatch this workflow explicitly on their exact head SHA.
    # Ignoring the redundant event avoids GitHub's approval-required run for PRs
    # opened by GITHUB_TOKEN while the dispatched Required check remains mandatory.
    paths-ignore:
      - data/coding-agents.json
      - data/deep-swe-evidence.json
      - data/first-party-release-radar.json
      - data/model-release-radar.json
      - data/terminal-bench.json
      - data/terminal-bench-science.json
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Cloudflare's documented always-pass public test key. Vercel uses the
      # hostname-restricted live key.
      NEXT_PUBLIC_HRANESS_MAILING_TURNSTILE_SITEKEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check application
        run: bun run check

  required:
    name: Required
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking job
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
