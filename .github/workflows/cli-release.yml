name: Qualify Linux CLI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-qualification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'hraness/aicharts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install the fixed Rust toolchain and source notices
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup component add rust-src --toolchain 1.97.1
      - name: Build, measure, and test a new installation
        env:
          QUALIFICATION_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          qualification_scratch="$(mktemp -d)"
          qualification_tree="$(git rev-parse --verify "${QUALIFICATION_COMMIT}^{tree}")"
          echo "QUALIFICATION_OUTPUT=${qualification_scratch}/result" >> "$GITHUB_ENV"
          node scripts/release/run-linux.mjs --repository "$GITHUB_WORKSPACE" --commit "$QUALIFICATION_COMMIT" --tree "$qualification_tree" --output "${qualification_scratch}/result"
      # These are short-lived nonpublishing test artifacts. No release, package,
      # provenance attestation, production credential, or user installation.
      - name: Retain the exact successful qualification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.QUALIFICATION_OUTPUT }}/assets/*
            ${{ env.QUALIFICATION_OUTPUT }}/qualification.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain the bounded diagnostic summary
        if: always() && env.QUALIFICATION_OUTPUT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-qualification-summary-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_OUTPUT }}/summary.json
          if-no-files-found: warn
          retention-days: 7
