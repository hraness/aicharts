name: Nightly assurance

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-assurance-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  NO_COLOR: "1"

jobs:
  nightly:
    name: Nightly evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Check bootstrap prerequisites
        run: python3 --version && zstd --version && rustup --version
      - name: Record Linux disk headroom before provisioning
        run: df -h .
      - name: Check bootstrap admission regressions
        run: bun test scripts/assurance-tools.test.ts && python3 verify/tools/test_prepare.py
      - name: Provision checksum-pinned formal tools
        id: tools
        run: bun scripts/assurance-tools.ts
      - name: Install pinned cargo-audit
        run: cargo audit --version || cargo install cargo-audit --locked --version 0.22.2
      - name: Check nightly model suites
        id: tla
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bun run usage:formal:tla -- --profile nightly
      - name: Run seeded kernel fuzz evidence
        id: fuzz
        if: ${{ !cancelled() }}
        run: bun run usage:fuzz -- --iterations 200000 --timeout-minutes 90
      - name: Run the injected-failure inventory
        id: fault-matrix
        if: ${{ !cancelled() }}
        run: bun run usage:fault-matrix
      - name: Run the supply-chain, secret and privacy gate
        id: security
        if: ${{ !cancelled() }}
        run: bun run security:check
      - name: Run the soak-lite performance baseline
        id: perf
        if: ${{ !cancelled() && hashFiles('scripts/usage-perf.ts') != '' }}
        run: bun run usage:perf
      - name: Record Linux tool footprint and remaining capacity
        if: always()
        run: |
          df -h .
          if test -d target/assurance-tools; then du -sh target/assurance-tools; fi
      - name: Retain nightly receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-assurance-${{ github.run_id }}
          path: |
            target/assurance/tools/
            target/assurance/tla/
            target/assurance/fuzz/
            target/assurance/fault-matrix/
            target/assurance/security/
            target/assurance/perf/
            verify/assurance/fault-matrix.json
            verify/tools/manifest.json
            verify/tla/toolchain.json
          if-no-files-found: error
          retention-days: 30
      - name: Require every nightly gate
        if: always()
        env:
          TOOLS_RESULT: ${{ steps.tools.outcome }}
          TLA_RESULT: ${{ steps.tla.outcome }}
          FUZZ_RESULT: ${{ steps.fuzz.outcome }}
          FAULT_MATRIX_RESULT: ${{ steps.fault-matrix.outcome }}
          SECURITY_RESULT: ${{ steps.security.outcome }}
          PERF_RESULT: ${{ steps.perf.outcome }}
        run: |
          test "$TOOLS_RESULT" = success
          test "$TLA_RESULT" = success
          test "$FUZZ_RESULT" = success
          test "$FAULT_MATRIX_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$PERF_RESULT" = success || test "$PERF_RESULT" = skipped
