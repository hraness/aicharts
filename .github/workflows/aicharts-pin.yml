name: aicharts pin

# Every six hours, refresh the release this repository's installer and
# release record pin to the newest stable cli-v* tag, verify the pin against
# the release's own checksum files, run the installer tests, and open a pull
# request. The data-refresh app pushes the branch and opens the PR so the
# ordinary pull_request CI gate decides the merge; this workflow never edits
# main directly.

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aicharts-pin
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the pinned release
    if: github.repository == 'hraness/aicharts'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Refresh the pinned aicharts release
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/refresh-aicharts-pin.mjs \
            --pin scripts/install.sh \
            --record lib/usage-cli-release.ts \
            --doc docs/usage-local.md \
            --doc distribution/cli/docs/usage-install.md
      - name: Validate the refreshed files
        if: steps.refresh.outputs.changed == 'true'
        run: |
          sh -n scripts/install.sh
          bun install --frozen-lockfile
          bun test app/install.sh/install-script.test.ts
      - name: Mint the data-refresh writer token
        id: writer
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AICHARTS_DATA_REFRESH_APP_ID }}
          private-key: ${{ secrets.AICHARTS_DATA_REFRESH_APP_PRIVATE_KEY }}
          owner: hraness
          repositories: aicharts
          permission-contents: write
          permission-pull-requests: write
      - name: Publish the pin update as a pull request
        if: steps.refresh.outputs.changed == 'true' && steps.writer.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          GITHUB_TOKEN: ${{ steps.writer.outputs.token }}
          VERSION: ${{ steps.refresh.outputs.version }}
          COMMIT: ${{ steps.refresh.outputs.commit }}
        run: |
          set -euo pipefail
          branch="automation/aicharts-pin-$VERSION"
          git config user.name "0thernet"
          git config user.email "894119+0thernet@users.noreply.github.com"
          git add scripts/install.sh lib/usage-cli-release.ts docs/usage-local.md distribution/cli/docs/usage-install.md
          git commit -m "chore: pin aicharts $VERSION"
          # The branch is disposable automation state; a rerun for the same
          # release regenerates it rather than descending from the stale tip.
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          while IFS= read -r stale_number; do
            [[ -z "$stale_number" ]] && continue
            gh pr close "$stale_number" --delete-branch --comment "Superseded by the pin refresh in ${run_url}." || true
          done < <(gh pr list --state open --limit 50 --json number,headRefName --jq --arg keep "$branch" '.[] | select(.headRefName | startswith("automation/aicharts-pin-")) | select(.headRefName != $keep) | .number')

          pr_url="$(gh pr list --head "$branch" --json url --jq '.[0].url')"
          if [[ -z "$pr_url" ]]; then
            printf -v pr_body 'Pins the installer and release record to [aicharts cli-v%s](https://github.com/hraness/aicharts/releases/tag/cli-v%s) (commit `%s`).\n\nDigests come from the release'"'"'s own checksum files and the installer tests passed before this PR was opened; Required CI decides the merge.' "$VERSION" "$VERSION" "$COMMIT"
            pr_url="$(gh pr create --base main --head "$branch" --title "chore: pin aicharts $VERSION" --body "$pr_body")"
          fi
          gh pr merge "$pr_url" --auto --squash --delete-branch
