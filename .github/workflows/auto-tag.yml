name: Tag CLI release

# Once a workspace version bump passes CI on main, this starts the
# nonpublishing "Qualify Linux CLI" run for that commit, waits for it to
# succeed, and then creates the annotated cli-v<version> tag on the exact
# qualified commit, which starts cli-publish.yml. The tag comes from the
# hraness-release-tagger GitHub App because tags pushed with GITHUB_TOKEN do
# not trigger workflows.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Qualify and tag version bump
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Detect workspace version bump
        id: version
        run: |
          set -euo pipefail
          read_version() { node -e 'const m = require("fs").readFileSync(0, "utf8").match(/^version = "((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))"$/mu); if (m) process.stdout.write(m[1])'; }
          version="$(read_version < Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "Cargo.toml has no stable workspace version; nothing to tag."
            exit 0
          fi
          previous="$(git show HEAD^:Cargo.toml 2>/dev/null | read_version || true)"
          if [[ "$previous" == "$version" ]]; then
            echo "Version $version is unchanged; nothing to tag."
            exit 0
          fi
          printf 'version=%s\ntag=cli-v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"
      - name: Qualify the exact commit
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving it unchanged."
            exit 0
          fi
          # Qualification always runs on main's head. Tag only if that head is
          # still this commit, so the qualified bytes are the tagged bytes.
          head="$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)"
          if [[ "$head" != "$SHA" ]]; then
            echo "::warning::main moved past $SHA; the next version bump's run will tag."
            exit 0
          fi
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Linux and macOS qualify in parallel; publication needs both.
          for workflow in cli-release.yml cli-macos.yml; do gh workflow run "$workflow" -R "$REPO" --ref main; done
          for workflow in cli-release.yml cli-macos.yml; do
            run=""
            for _ in $(seq 1 30); do
              sleep 10
              run="$(gh run list -R "$REPO" --workflow "$workflow" --branch main --event workflow_dispatch --commit "$SHA" \
                --json databaseId,createdAt -q "[.[] | select(.createdAt >= \"$started\")] | sort_by(.createdAt) | last | .databaseId // empty")"
              [[ -n "$run" ]] && break
            done
            [[ -n "$run" ]] || { echo "::error::$workflow run did not start"; exit 1; }
            gh run watch "$run" -R "$REPO" --exit-status --interval 30 >/dev/null
            echo "Qualified $SHA in $workflow run $run"
          done
          echo "QUALIFIED=true" >> "$GITHUB_ENV"
      - name: Mint tagger token
        if: env.QUALIFIED == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_TAGGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_TAGGER_PRIVATE_KEY }}
          permission-contents: write
      - name: Create annotated tag
        if: env.QUALIFIED == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          object="$(gh api "repos/$REPO/git/tags" -f tag="$TAG" -f message="aicharts CLI ${TAG#cli-v}" -f object="$SHA" -f type=commit -q .sha)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
          echo "Created $TAG at $SHA"
