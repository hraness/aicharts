name: CodingChart data refresh

on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codingchart-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Artificial Analysis snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNAPSHOT_PATH: data/coding-agents.json
    steps:
      # Scheduled and manual runs always execute trusted default-branch code.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Refresh snapshot from Artificial Analysis
        run: bun run data:refresh
      - name: Detect refreshed snapshot
        id: snapshot
        shell: bash
        run: |
          changed_files="$(git diff --name-only)"
          if [[ -z "$changed_files" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Artificial Analysis data is unchanged."
            exit 0
          fi

          if [[ "$changed_files" != "$SNAPSHOT_PATH" ]]; then
            echo "Refresh changed an unexpected file set:"
            printf '%s\n' "$changed_files"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Validate updated application
        if: steps.snapshot.outputs.changed == 'true'
        run: bun run check
      - name: Commit and publish updated snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "0thernet"
          git config user.email "894119+0thernet@users.noreply.github.com"
          git add -- "$SNAPSHOT_PATH"
          git commit -m "chore: refresh benchmark data"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
