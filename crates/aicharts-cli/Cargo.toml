[package]
name = "aicharts-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "aicharts"
path = "src/main.rs"

[dependencies]
aicharts-core.workspace = true
aicharts-custody.workspace = true
aicharts-protocol.workspace = true
aicharts-ledger.workspace = true
aicharts-import.workspace = true
serde.workspace = true
time.workspace = true
base64.workspace = true
rusqlite.workspace = true
hmac.workspace = true
sha2.workspace = true
serde_json.workspace = true
getrandom.workspace = true
ureq.workspace = true
log.workspace = true
hraness-support-foundation = { git = "https://github.com/hraness/support-foundation", rev = "ed89e584c2c420e3e0547bbe8f32baf8e3a2ae4d" }

[dev-dependencies]
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
aicharts-platform-process.workspace = true
libc.workspace = true
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
aicharts-platform-acl.workspace = true
