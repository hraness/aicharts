[package]
name = "aicharts-custody"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
aicharts-platform-acl.workspace = true
rustix = { version = "=1.1.4", features = ["fs", "process"] }
security-framework = { version = "=3.7.0", default-features = false }
core-foundation = "=0.10.1"
