[workspace]
members = ["crates/aicharts-protocol", "crates/aicharts-core", "crates/aicharts-ledger", "crates/aicharts-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.97"
publish = false

[workspace.dependencies]
aicharts-protocol = { path = "crates/aicharts-protocol" }
aicharts-core = { path = "crates/aicharts-core" }
aicharts-ledger = { path = "crates/aicharts-ledger" }
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
getrandom = "0.3"
libc = "0.2"
