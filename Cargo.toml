[workspace]
members = ["crates/aicharts-protocol", "crates/aicharts-core", "crates/aicharts-ledger", "crates/aicharts-cli", "crates/aicharts-custody", "crates/aicharts-platform-acl"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.97"
publish = false

[workspace.dependencies]
aicharts-protocol = { path = "crates/aicharts-protocol" }
aicharts-core = { path = "crates/aicharts-core" }
aicharts-ledger = { path = "crates/aicharts-ledger" }
aicharts-custody = { path = "crates/aicharts-custody" }
aicharts-platform-acl = { path = "crates/aicharts-platform-acl" }
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
getrandom = "0.3"
libc = "0.2"
ureq = { version = "=3.4.1", default-features = false, features = ["rustls"] }
# HTTP dependencies trace raw request/response bytes. Suppress their log facade
# in every build profile, including tests; sensitive Debug headers are insufficient.
log = { version = "=0.4.34", features = ["max_level_off"] }
