[package]
name = "tokscale-core"
version = "4.17.0-aicharts.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/junhoyeo/tokscale"
publish = false

[lib]
test = false
doctest = false

[dependencies]
rayon = "1.10"
simd-json = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots", "rustls-tls-webpki-roots"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
dirs = "5"
once_cell = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "limits", "hooks"] }
zstd = "0.13"
tracing = { version = "0.1", features = ["max_level_off"] }
sha2 = "0.10"
libc = "0.2"
fs2 = "0.4"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
